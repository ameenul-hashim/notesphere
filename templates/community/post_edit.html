{% extends "base.html" %}
{% block title %}Edit Post | NoteSphere{% endblock %}
{% block topbar_title %}Edit Post{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
  <div class="page-head flex items-center justify-between">
    <div>
      <h1 class="page-title">Edit Discussion Post</h1>
      <p class="page-subtitle">Update topic title or question content.</p>
    </div>
    <a href="{% url 'community:chat' %}" class="btn btn-ghost btn-sm">Cancel</a>
  </div>

  <div class="card card-pad bg-surface border border-border shadow-sm rounded-2xl">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="field-label">Topic Title (Optional)</label>
        <input
          type="text"
          name="title"
          value="{{ post.title }}"
          class="input text-sm rounded-xl"
        />
      </div>
      <div>
        <label class="field-label">Content</label>
        <textarea
          name="content"
          rows="5"
          required
          class="textarea text-sm rounded-xl"
        >{{ post.content }}</textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2">
        <a href="{% url 'community:chat' %}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
