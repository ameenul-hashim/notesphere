{% if url %}
  <a href="{{ url }}" class="block rounded-lg border p-4 {{ card_class }} transition hover:opacity-90">
{% else %}
  <div class="rounded-lg border p-4 {{ card_class }}">
{% endif %}
  <p class="text-sm {{ text_class }}">{{ label }}</p>
  <p class="text-2xl font-bold">{{ value }}</p>
{% if url %}
  </a>
{% else %}
  </div>
{% endif %}
