{% if status == 'ACTIVE' %}
  <span class="badge badge-success">{{ label|default:status }}</span>
{% elif status == 'BLOCKED' %}
  <span class="badge badge-danger">{{ label|default:status }}</span>
{% elif status == 'INACTIVE' %}
  <span class="badge badge-warning">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    {{ label|default:status }}
  </span>
{% else %}
  <span class="badge badge-neutral">{{ label|default:status }}</span>
{% endif %}
