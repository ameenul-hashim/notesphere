{% if status == 'ACTIVE' %}
  <span class="badge badge-success">{{ label|default:status }}</span>
{% elif status == 'BLOCKED' %}
  <span class="badge badge-danger">{{ label|default:status }}</span>
{% elif status == 'INACTIVE' %}
  <span class="badge badge-warning">{{ label|default:status }}</span>
{% else %}
  <span class="badge badge-neutral">{{ label|default:status }}</span>
{% endif %}
