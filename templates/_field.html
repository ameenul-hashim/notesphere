<div class="field">
  {% if field.label %}
    <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}</label>
  {% endif %}
  {% if icon %}
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        {% if icon == "user" %}
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        {% elif icon == "id" %}
          <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M12 15a3 3 0 0 1 3-3h3"/><path d="M8 14h1"/>
        {% elif icon == "mail" %}
          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/>
        {% elif icon == "phone" %}
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        {% elif icon == "lock" %}
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        {% elif icon == "key" %}
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        {% endif %}
      </svg>
      {{ field }}
    </div>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}
    <p class="field-hint">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    {% for error in field.errors %}
      <p class="field-error">{{ error }}</p>
    {% endfor %}
  {% endif %}
</div>
