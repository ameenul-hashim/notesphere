<div class="mb-4">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1 dark:text-slate-300">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
    {% for error in field.errors %}
      <p class="text-sm text-red-600 mt-1 dark:text-red-400">{{ error }}</p>
    {% endfor %}
  {% endif %}
</div>
