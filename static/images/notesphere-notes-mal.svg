<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="380" fill="url(#glow)" />

  <!-- Outer Sphere Orbit Ring -->
  <circle cx="640" cy="300" r="155" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="12" stroke-dasharray="18 14" />

  <!-- Bold 'N' Mark with Book Curve -->
  <g transform="translate(268.8,-109.6) scale(1.6)" filter="url(#shadow)">
    <path d="M160 352 V 160 L 268 310 V 160 H 304 V 352 L 196 202 V 352 Z" fill="#FFFFFF" />
  </g>

  <!-- Floating Orbital Sphere Dot -->
  <circle cx="832" cy="146" r="44" fill="#F43F5E" opacity="0.9" />
  <circle cx="832" cy="146" r="31" fill="#FB7185" />

  <!-- Wordmark -->
  <text x="640" y="470" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="6" fill="#FFFFFF" opacity="0.95">NOTESPHERE</text>
  <text x="640" y="528" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="400" letter-spacing="3" fill="#FFFFFF" opacity="0.7">MALAYALAM MEDIUM NOTES</text>
</svg>
